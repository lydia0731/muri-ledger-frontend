<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src http://localhost:3001; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"><title>木日｜記帳</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./app.css"></head><body><main id="auth" class="auth-wrap"><section class="auth-card"><div class="brand"><span class="mark">▥</span>木日 <span class="tiny">記帳</span></div><h1>把日子，慢慢記下來。</h1><p class="auth-note">一本屬於你的生活帳本。</p><form id="loginForm"><label class="field">UserID<input id="userId" autocomplete="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9_-]{3,40}" required placeholder="你的帳號"></label><label class="field">Email<input id="email" type="email" autocomplete="email" maxlength="254" required placeholder="與帳號綁定的信箱"></label><button class="add full" id="requestCode">寄送登入驗證碼</button></form><form id="verifyForm" hidden><label class="field">Email 驗證碼<input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" maxlength="8" required placeholder="8 位數字"></label><button class="add full" id="verifyCode">登入帳本</button><button class="subtle-btn full" type="button" id="backLogin">返回／重新寄送</button></form><p class="auth-note">登入後 20 分鐘自動登出。<br>僅限已由管理者建立的帳號。</p></section></main><p id="status" role="status" aria-live="polite"></p><div class="shell" id="ledger" hidden><header><button id="logout" class="subtle-btn">登出</button><div class="brand"><span class="mark">▥</span>木日<span class="tiny">記帳</span></div><div class="date"><button class="arrow" id="prev" aria-label="上個月">‹</button><strong id="month"></strong><button class="arrow" id="next" aria-label="下個月">›</button></div></header>
<main class="book">
<div class="pages"><section class="page left" id="weekly"><div class="section-title"><h2>每週消費</h2><div class="weekly-actions"><span class="tiny" id="weekRange"></span><button class="add" id="new">＋ 記一筆</button></div></div><div class="weeks" id="weeks"></div><table class="ledger"><thead><tr><th>日期</th><th>項目</th><th>金額</th><th aria-label="刪除"></th></tr></thead><tbody id="entries"></tbody></table><div class="subtotal"><span>本週合計</span><strong class="money" id="weekTotal"></strong></div></section>
<section class="page" id="fixed"><div class="section-title"><h2>每月繳費</h2><button class="add fixed-add" id="addFixed">＋ 新增</button></div><div id="fixedList"></div><div class="summary"><h2>本月總結</h2><div class="sumrow"><span>每月消費</span><span class="money" id="expenseTotal"></span></div><div class="sumrow"><span>每月繳費</span><span class="money" id="fixedTotal"></span></div><div class="sumrow"><span>每月收入</span><span class="money" id="incomeTotal"></span></div><div class="sumrow total"><span>本月合計</span><strong class="money" id="grandTotal"></strong></div></div></section></div>
</main></div>
<dialog id="dialog"><form id="form"><div class="section-title"><h2 id="formTitle">記一筆</h2><button type="button" id="close" aria-label="關閉">✕</button></div><label class="field">日期<input type="date" id="entryDate" required></label><label class="field">項目<input id="entryName" required maxlength="30" autocomplete="off"></label><label class="field">金額<input id="entryAmount" type="number" min="1" step="1" required></label><label class="field" id="categoryField">分類<select id="category"><option>支出</option><option>收入</option></select></label><div class="actions"><button type="button" id="cancel">取消</button><button class="add" type="submit">儲存</button></div></form></dialog>
<script type="module" src="./app.js"></script></body></html>
